              STACK_HOST=${STACK_HOST} \
              OCP_BLOCK_STORAGE=${OCP_BLOCK_STORAGE} \
              sh > idig-cluster-instance.yaml

            if [ -z "$(oc get secret watsonx-credentials -n $NS_NAME --no-headers --ignore-not-found)" ]; then
